version: 2
updates:
  - package-ecosystem: composer
    directory: "/backend"
    schedule: {interval: "daily"}
    open-pull-requests-limit: 8
    labels: ["dependencies"]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: "/frontend"
    schedule: {interval: "weekly"}
    open-pull-requests-limit: 8
    labels: ["dependencies"]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    ignore:
      # Versions sind bewusst via frontend/pnpm-workspace.yaml gepinnt
      # (Overrides) — Dependabot-Updates würden dort gegen den Workspace laufen.
      - dependency-name: "nanoid"
      - dependency-name: "react-router"
      - dependency-name: "react-router-dom"
      - dependency-name: "brace-expansion"
      - dependency-name: "svgo"
      - dependency-name: "postcss"
      - dependency-name: "undici"
  - package-ecosystem: github-actions
    directory: "/"
    schedule: {interval: "weekly"}
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    groups:
      # Actions-Pins folgen NICHT der Minor/Patch-Logik der Dependency-Gruppen
      # (automerge.yml mergt nur `dependency-group: minor-and-patch`), also eine
      # eigene Gruppe.
      actions:
        applies-to: version-updates
  - package-ecosystem: docker
    # `deployment/Dockerfile` (prod, FROM php:8.5-fpm) und
    # `deployment/Dockerfile.e2e` (FROM accriditation-base:8.5). Ohne dieses
    # Ecosystem war der `notDocker`-Zweig in automerge.yml toter Code.
    directory: "/deployment"
    schedule: {interval: "weekly"}
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker"]
