name: Build and Push Base Image

# Tag-Schema — WICHTIG (die alte Kommentar-Zeile ":8.5 pins the PHP minor for
# reproducible, rollback-safe runs" war FALSCH):
#
#   :8.5-<run_number>  immutable. `github.run_number` waechst mit jedem Lauf
#                      dieses Workflows, wird also nie ueberschrieben — auch
#                      nicht vom taeglichen Cron, der denselben Commit erneut
#                      gegen ein inzwischen aktualisiertes `php:8.5-fpm` baut.
#   :<tag>@<digest>    immutable. Wird pro Lauf als Job-Output `image_ref` und
#                      im Step-Summary publiziert. DAS ist der Referenz-Wert,
#                      den ein Konsument pinnen soll.
#   :8.5 / :latest     BEWEGLICH. Beide werden bei jedem Build ueberschrieben
#                      (Push auf main, `workflow_dispatch` UND der nightly
#                      Cron `0 1 * * *`) und sind damit genauso variabel wie
#                      :latest. Sie sind Komfort-Referenzen fuer
#                      Docker-Compose/`docker run`, KEINE Determinismus-Garant.
#
# Konsequenz fuer Konsumenten: Wer einen stabilen, auditierbaren Lauf braucht,
# pinnt den Digest. `deployment/Dockerfile.e2e` macht das ueber einen
# Digest-Pass-through (`ARG BASE_REF` + `FROM ${BASE_REF}`, gesetzt von
# `e2e-image.yml`); der benutzte Wert steht als Image-Label
# `org.opencontainers.image.base.name` im E2E-Image. Der Digest wird dabei zur
# Build-Zeit aus der Registry gelesen, nicht aus diesem Job-Output gelesen —
# siehe die Begruendung im Determinismus-Absatz von `Dockerfile.e2e`. Ohne
# Build-Arg faellt `Dockerfile.e2e` auf den beweglichen `:8.5`-Tag zurueck.
on:
  push:
    branches: [ "main" ]
    # ------------------------------------------------------------------------
    # Include-Liste (`paths`), BEWUSST kein `paths-ignore` — die Abweichung vom
    # Skill `github-ci-filters` (Schritt 2) ist hier die richtige Form und
    # gemessen begründet:
    #
    # Der Skill empfiehlt `paths-ignore` für den DOKU-Fall: die Ignore-Menge
    # (eine Handvoll `.md`) ist winzig, die interessante Menge (aller Code) ist
    # riesig. Hier ist es umgekehrt: die Build-Eingabemenge ist POSITIV und
    # winzig (der Build-Kontext selbst), die Ignore-Menge wäre "alles andere im
    # Repo". `paths-ignore` kann das nicht ausdrücken — es gibt dort keine
    # Negation (`!`), nur `paths` kennt sie. Man müsste also `backend/**`,
    # `frontend/**`, `features/**` … einzeln auflisten und stünde dann vor
    # derselben Aufgabe wie heute: eine Liste pflegelassen, die auseinanderlaufen
    # kann. Und jeder Fehler geht in die gefährliche Richtung: ein neuer
    # Ordner, den niemand ignoriert, löst stattdessen einen unnötigen Image-Build
    # mit Tag-Push auf `:8.5`/`:latest` aus (teuer, aber harmlos) — ein neuer
    # Input, den niemand GELISTET hat, wird nie gebaut (still, dauerhaft).
    #
    # `deployment/**` statt `deployment/Dockerfile` (vorher): der Build liest
    # mit `context: deployment` den GANZEN Ordner und installiert daraus drei
    # Skripte per `RUN --mount=type=bind` — `deployment/Dockerfile:216`
    # (`entrypoint.sh`, Smoke-Test: Lauf mit `bogus-mode` und Abbruch bei Exit
    # 64, `:207-221`), `:251` (`backend-supervisor.sh`) und `:252`
    # (`backend-healthcheck.sh`), beide im `sh -n`-Smoke-Test der Schleife
    # `:239-254`. Die alte
    # Liste nannte nur das Dockerfile: eine Änderung an `entrypoint.sh` allein
    # hat das Basis-Image NICHT neu gebaut, das publizierte `:8.5`/`:latest`
    # behielt das alte Skript. Gebremst wird das nur durch den nightly Cron
    # (`0 1 * * *`) — also bis zu 24 h Drift auf genau dem Skript, das der
    # Deploy ausführt (AGENTS.md §10 A6). Der Kontext-Pfad als Muster zu
    # nehmen macht die Liste an den Kontext gekoppelt statt an eine Aufzählung:
    # eine neue Datei in `deployment/` kann nicht mehr übersehen werden.
    #
    # Der Root-`.dockerignore` ist bewusst NICHT gelistet: laut eigener
    # Dokumentation in `.dockerignore` wird er für `context: deployment` gar
    # nicht gelesen — er ist damit kein Build-Input.
    # ------------------------------------------------------------------------
    paths:
      - 'deployment/**'
      - '.github/workflows/base-image.yml'
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # Immutable Referenz dieses Builds. Der Digest kommt von
      # `docker/build-push-action`, der Step `publish` stellt daraus
      # `<image>@<digest>` zusammen — damit Konsumenten (z. B.
      # `deployment/Dockerfile.e2e`) einen echten Pin benutzen koennen statt
      # eines Tags, der bei jedem Build ueberschrieben wird. Derselbe Digest
      # ist der, den der Tag `:8.5` in diesem Lauf aufloest (ein Push setzt
      # Tag und Digest), und genau den loest `e2e-image.yml` zur Build-Zeit
      # direkt aus der Registry auf.
      image_ref: ${{ steps.publish.outputs.image_ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7  # major tag pin — SHA-pinning (actions/checkout@<full-sha>) is a stronger, immutable option

      - name: Log in to the Container registry
        uses: docker/login-action@v4  # major tag pin — SHA-pinning is a stronger, immutable option
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4  # major tag pin — SHA-pinning is a stronger, immutable option

      - name: Build and Push accriditation-base Image (amd64)
        id: build
        uses: docker/build-push-action@v7  # major tag pin — SHA-pinning is a stronger, immutable option
        with:
          context: deployment
          push: true
          platforms: linux/amd64
          build-args: |
            PHP_VERSION=8.5
            DB_EXT=pgsql
          # Tag-Schema (siehe Kommentar unten):
          #   :8.5-<run_number>  immutable, monoton steigend, wird NIE
          #                      ueberschrieben (run_number waechst mit jedem
          #                      Workflow-Run — auch beim nightly Rebuild).
          #   :8.5 / :latest     BEWEGLICHE Aliasse, die bei JEDEM Build
          #                      neu gesetzt werden (Konfort-Referenzen fuer
          #                      lokale Docker-Compose-Setups).
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/accriditation-base:8.5-${{ github.run_number }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/accriditation-base:8.5
            ${{ env.REGISTRY }}/${{ env.OWNER }}/accriditation-base:latest

      - name: Publish immutable reference
        id: publish
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/accriditation-base
          DIGEST: ${{ steps.build.outputs.digest }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || { echo "::error::build-push-action lieferte keinen Digest"; exit 1; }
          image_ref="${IMAGE}@${DIGEST}"
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"
          # ACHTUNG: Ziel der Tabelle ist die Step-Summary-Datei des Steps
          # (Umgebungsvariable `GITHUB_STEP_SUMMARY`). Die Workflow-Ebene hat
          # keine entsprechende Variable: mit dem falschen Namen bricht der
          # Step unter `set -u` (siehe oben) mit "unbound variable" ab und der
          # Job wird rot — bzw. schreibt die Markdown-Tabelle kommentarlos in
          # eine Datei im Workspace, die nie im Job-UI auftaucht.
          {
            echo "### accriditation-base"
            echo
            echo "| Referenz | Art |"
            echo "| --- | --- |"
            echo "| \`${IMAGE}:8.5-${RUN_NUMBER}\` | immutable (Run-Nummer) |"
            echo "| \`${image_ref}\` | immutable (Digest) |"
            echo "| \`${IMAGE}:8.5\`, \`${IMAGE}:latest\` | **beweglich** — bei jedem Build neu gesetzt, auch durch den nightly Cron \`0 1 * * *\` |"
          } >> "$GITHUB_STEP_SUMMARY"
