name: CI

# Push auf ALLE Branches + Pull Requests. Backend/Frontend laufen überall;
# der E2E-Job läuft bei `push`/`pull_request`/`schedule`/`workflow_dispatch`
# (keine externen Secrets nötig, aber bewusst schlank gehalten — kein
# Meilisearch, kein Stripe in diesem Projekt). Er zieht die VOLLE E2E-Suite
# (@smoke + @regression + @feature:*) — auch auf `push`/`pull_request`.
# Unterschiedlich ist nur das Fehler-Budget: verzeihendes Profil für
# Push/PR/Default-Dispatch, striktes Profil für `schedule` (Nightly) und
# `e2e_suite=strict` (siehe Run-Step).
on:
  push:
  pull_request:
  # Nightly: dieselbe volle Suite, aber mit dem strikten Profil (retries: 0,
  # maxFailures: 1) — der Flakiness-Detektor.
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      e2e_server:
        description: 'Welchen Frontend-Server soll der E2E-Job testen? (preview = Production-Bundle, dev = Dev-Server für schnelle Iterationsläufe)'
        type: choice
        default: preview
        options:
          - preview
          - dev
      e2e_suite:
        description: 'Welche E2E-Suite soll laufen? (full = alle Tests mit verzeihendem Profil wie beim Push/PR — Standard; smoke = nur die schnellen @smoke-Tests, Iterationshilfe ohne Gate; strict = alle Tests mit striktem Fehler-Budget wie der Nightly, ein einziger Fehlversuch ist rot)'
        type: choice
        default: full
        options:
          - full
          - smoke
          - strict

concurrency:
  # Der Suffix trennt den Nightly von den Event-Runs: `github.ref` ist beim
  # `schedule`-Event derselbe Default-Branch wie bei einem `push` darauf, und
  # ohne eigenen Group-Namen würde ein Push mitten im Nightly-Lauf den Job
  # cancelen (der Push hat `cancel-in-progress: true`) — genau der Lauf, der
  # NICHT abgebrochen werden darf.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || 'event' }}
  # Nightly wird nie abgebrochen (auch nicht von einem späteren Push auf main);
  # alle anderen Runs bleiben wie gehabt cancel-in-progress, damit ein
  # superseded Push nicht minutenlang CI-Minuten verbrennt.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

# ==========================================================================
# CI-Parallelität: die vier Jobs laufen PARALLEL — gewollt (Nutzerentscheid
# 2026-09-30: CI-Parallelfähigkeit unangetastet, gedeckelt wird nur die lokale
# Arbeit, höchstens zwei Ströme). „Auf 2 deckeln" wäre nicht nur unerwünscht,
# sondern nicht umsetzbar: Actions deckt parallele Jobs eines Workflows nicht
# ab, und `concurrency` (unten) regelt Runs — Abbruch/Queue — nicht Jobs. Es
# ginge nur über `matrix` + `max-parallel: 2`; das zerlegt das Job-Setup
# (`backend-pgsql` braucht einen `postgres:17`-Service, `e2e` einen
# Job-Level-`if`, wo `matrix` nicht verfügbar ist) — nicht beauftragt.
#
# Die beiden Serial-Entscheidungen sind **gemessen**, nicht vorsichtig; ihre
# Belege stehen an den Stellen, wo sie entstehen (eine Kopie hier driftet ab):
#   * `e2e`/Run-Step — geteilte CI-IP + Login-Drossel 40/min (Zähler im DB-Cache)
#     ⇒ 429 bei parallelen Workern; sechs Netto-Ausfälle, erst falsch attribuiert.
#   * `backend-pgsql`/Run-Step — paratest gibt jedem Worker eine eigene Test-DB,
#     der Job fährt gegen EINE Wegwerf-DB ⇒ nie `--parallel`.
# Lokal dieselbe Grenze, andere Hälfte der Tabelle: `Agents.headless.md` §4.1.
# ==========================================================================
jobs:
  backend:
    name: Backend (PHPUnit + Pint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mailpit:
        # phpunit.xml pinnt MAIL_MAILER=array (socketlos, Position 42): die
        # meisten Tests senden damit nirgends hin. ABER der Mandant-Pfad
        # `MandantMailerService::send()` ruft `Mail::mailer('smtp')` explizit
        # (backend/app/Services/MandantMailerService.php:54) und geht am
        # array-Pin vorbei — dieser Mailer wird aus MAIL_HOST/MAIL_PORT
        # (127.0.0.1:1025) gebaut. Mailpit ist deshalb weiterhin das reale
        # SMTP-Backend dieses Pfades (phpunit.xml beziffert ihn mit ~132
        # Sendungen pro Volllauf) und deckt zugleich das Dev-Setup ab.
        # Mail::fake nutzen die Mailable-Tests weiterhin; für den expliziten
        # smtp-Pfad bleibt Mailpit das Real-Backend statt eines Fake.
        # CC-R4: untagged → resolves to `:latest` (floating). No reproducible
        # version is pinned in this repo:
        # TODO: pin to an immutable digest (e.g. axllent/mailpit@sha256:…) for reproducible CI
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v7  # major tag pin — SHA-pinning (actions/checkout@<full-sha>) is a stronger, immutable option
      - name: Setup PHP
        uses: shivammathur/setup-php@v2  # major tag pin — SHA-pinning is a stronger, immutable option
        with:
          php-version: 8.5
          extensions: mbstring, pgsql, pdo_pgsql, pdo_sqlite, dom, gd, zip
          coverage: none
      - name: Install dependencies
        # `post-autoload-dump` bootet die App via `package:discover`. Ohne `.env`
        # (kommt erst im naechsten Schritt) ist `APP_ENV` der Laravel-Default
        # `production`, und der A2-Boot-Guard verweigert dann den Start ohne
        # brauchbaren `APP_KEY` — CI waere damit unmoeglich. Gleiche Loesung wie
        # `deployment/Dockerfile:150`: ein Wegwerf-Key nur fuer diesen Schritt.
        # Die Testsuite nutzt ohnehin den TEST-ONLY-APP_KEY aus `phpunit.xml`.
        run: APP_KEY="base64:$(head -c 32 /dev/urandom | base64)" composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: cp .env.example .env
      # Die beiden Key-Schritte sind für die Testsuite NICHT mehr die Quelle der
      # Wahrheit: `backend/phpunit.xml` pinnt inzwischen einen festen
      # TEST-ONLY-APP_KEY und JWT_SECRET, die Test-Suite ist also unabhängig von
      # der `.env`. Die Schritte bleiben als Absicherung für alles, was die
      # `.env` liest ( artisan config:clear im `composer test`-Script u. ä.).
      - name: Generate app key
        run: php artisan key:generate
      - name: Generate JWT secret
        run: php artisan jwt:secret --force
      - name: Run PHPUnit
        # failOnRisky/failOnWarning stehen in phpunit.xml — ein risiger Test
        # (z. B. ohne Assertion) oder eine PHPUnit-Warning machen den Job rot.
        run: php artisan test --no-ansi
      - name: Pint (code style)
        run: vendor/bin/pint --test

  backend-pgsql:
    # ==========================================================================
    # Postgres-Portabilitäts-Gate (AGENTS.md §2)
    # ==========================================================================
    # Der `backend`-Job fährt die Suite auf SQLite `:memory:`. Die beiden
    # CRITICAL-Regeln in AGENTS.md §2 (Transaktionsabbruch bei Unique-Verletzung
    # / `LIKE … ESCAPE`) sind gegen echtes PostgreSQL 17 verifiziert — bisher nur
    # durch Messung. Ohne wiederholbaren Lauf verfallen sie still, sobald niemand
    # mehr nachmisst. Dieser Job ist das Gate: dieselbe Suite, einziger
    # Unterschied ist die Engine. Damit ist es ein sauberer A/B-Vergleich.
    #
    # Blockierend seit der Behebung der beiden Test-Suite-Befunde — siehe den
    # Kommentar am Test-Step. Der `backend`-Job auf SQLite bleibt blockierend.
    name: Backend (PHPUnit vs. Postgres)
    runs-on: ubuntu-latest
    # Bewusst NICHT im E2E-Container: dort sind die Dienste nur per Service-NAME
    # erreichbar (`postgres:5432`), hier läuft der Job auf dem Runner, also
    # `127.0.0.1:5432` — dieselbe Topologie wie der `backend`-Job.
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Gleiche Major-Version wie der E2E-Job (`postgres:17-alpine`), bewusst
        # nichts neu gepinnt: die §2-Regeln sind gegen 17 verifiziert.
        image: postgres:17-alpine
        ports:
          - 5432:5432
        env:
          # Eigene DB, NICHT `accriditation` wie im E2E-Job: `RefreshDatabase`
          # macht `migrate:fresh` und würde die Dev-/Prod-Datenbank leeren. Jeder
          # Job bekommt ohnehin seinen eigenen Service-Container — der Name ist
          # nur die zweite Absicherung, falls das Gate irgendwann mal lokal
          # gegen einen laufenden Postgres läuft.
          POSTGRES_DB: accriditation_test
          POSTGRES_USER: accriditation
          # Wegwerf-Passwort für einen ephemeren CI-Service (gleiche Begründung
          # und gleiche Behandlungsweise wie im E2E-Job).
          POSTGRES_PASSWORD: accriditation
        options: >-
          --health-cmd="pg_isready -U accriditation -d accriditation_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      mailpit:
        # Bewusst identisch zum `backend`-Job. Die Mailable-Tests nutzen
        # `Mail::fake()`, aber Mailpit ist das Real-Backend als Sicherheitsnetz
        # für nicht-gefakte Mail-Zustellung — `phpunit.xml:65-69` zeigt auf
        # 127.0.0.1:1025. Ohne den Service wäre dieser Job gegenüber dem
        # `backend`-Job um mehr als die Engine unterschieden, und ein Mail-Fehler
        # wäre dann ein Befund, der in Wahrheit fehlender Infra ist.
        # CC-R4: untagged → resolves to `:latest` (floating). No reproducible
        # version is pinned in this repo:
        # TODO: pin to an immutable digest (e.g. axllent/mailpit@sha256:…) for reproducible CI
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
    # Die Engine-Umschaltung erfolgt rein über ENV — phpunit.xml wird NICHT
    # angefasst. Warum das trägt (nicht geraten, sondern im Code belegt):
    #
    #   * `backend/phpunit.xml:61-63` pinnt `DB_CONNECTION=sqlite` /
    #     `DB_DATABASE=:memory:` / `DB_URL=""` — OHNE `force="true"`.
    #   * `vendor/phpunit/phpunit/src/TextUI/Configuration/PhpHandler.php:160-168`
    #     setzt eine `<env>`-Variable nur, wenn `force` gesetzt ist ODER sie in
    #     der Prozess-Umgebung noch nicht existiert:
    #         if ($force || getenv($name) === false) { putenv(...); }
    #     Die Job-ENV gewinnt also gegen den phpunit.xml-Pin. (Dasselbe Prinzip,
    #     das der Kommentar in `phpunit.xml:35-42` für APP_KEY/JWT_SECRET belegt.)
    #   * Laravels Dotenv-Repository ist immutable und überschreibt keine bereits
    #     gesetzte Prozess-Variable — die `.env` kann die Job-ENV also weder
    #     übernehmen noch die Job-ENV überschreiben.
    #
    # Die Namen sind die aus `backend/config/database.php`, nicht Laravel-Defaults
    # geraten: `default` (Z. 20) `env('DB_CONNECTION')`, `pgsql`-Connection
    # (Z. 87-100) `DB_URL`/`DB_HOST`/`DB_PORT`/`DB_DATABASE`/`DB_USERNAME`/
    # `DB_PASSWORD`. `DB_URL` wird absichtlich NICHT gesetzt: der Leerwert aus
    # `phpunit.xml:63` ist ein bewiesener No-op
    # (`Illuminate/Support/ConfigurationUrlParser.php:43` — `if (! $url) return
    # $config;`).
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: accriditation_test
      DB_USERNAME: accriditation
      DB_PASSWORD: accriditation
    steps:
      - uses: actions/checkout@v7  # major tag pin — SHA-pinning (actions/checkout@<full-sha>) is a stronger, immutable option
      - name: Setup PHP
        uses: shivammathur/setup-php@v2  # major tag pin — SHA-pinning is a stronger, immutable option
        with:
          php-version: 8.5
          # pgsql/pdo_pgsql sind hier Pflicht (anders als beim SQLite-Lauf, wo
          # sie nur mitinstalliert, nicht benutzt werden).
          extensions: mbstring, pgsql, pdo_pgsql, pdo_sqlite, dom, gd, zip
          coverage: none
      - name: Install dependencies
        # Wegwerf-APP_KEY aus exakt demselben Grund wie im `backend`-Job:
        # `post-autoload-dump` bootet die App via `package:discover` und ohne
        # `.env` ist `APP_ENV` = `production`, wo der A2-Boot-Guard ohne Key hart
        # abbricht. Die Testsuite nutzt den TEST-ONLY-Key aus `phpunit.xml`.
        run: APP_KEY="base64:$(head -c 32 /dev/urandom | base64)" composer install --no-interaction --prefer-dist --no-progress
      # Env-Prep bewusst IDENTISCH zum `backend`-Job (`.env.example` + Key +
      # JWT-Secret). Nicht weil die Suite die `.env` bräuchte (phpunit.xml pinnt
      # APP_KEY/JWT_SECRET/DB_*), sondern damit der einzige Unterschied zwischen
      # den beiden Läufen die Engine ist. Jede abweichende `.env` würde sonst
      # einen Befund erzeugen, der eigentlich Env-Skew ist.
      - name: Prepare environment
        run: cp .env.example .env
      - name: Generate app key
        run: php artisan key:generate
      - name: Generate JWT secret
        run: php artisan jwt:secret --force
      - name: Assert the resolved driver is really pgsql
        # Self-check des Gates. Ohne diesen Schritt ist die ganze Job-Idee nicht
        # abgesichert: fiele die ENV-Umleitung aus irgendeinem Grund auf SQLite
        # zurück, wäre der Job ein zweiter SQLite-Lauf, der GRÜN ist und trotzdem
        # nichts prüft — das schlimmste Ergebnis, weil es als Absicherung
        # missverstanden wird. Geprüft wird die von Laravel aufgelöste Connection,
        # nicht der ENV-String. Dasselbe Skript nutzt `scripts/test-pgsql.sh`
        # lokal, damit CI und lokal dieselbe Prüfung fahren.
        run: php ../scripts/assert-db-driver.php pgsql
      - name: Run PHPUnit against Postgres
        # Bewusst SERIELL, niemals `--parallel`: paratest gibt jedem Worker eine
        # eigene Test-DB (`TestDatabases::testDatabase()`), und die SQLite-
        # Isolationsannahme der Suite (`backend/AGENTS.md`) — ein Prozess, eine
        # In-Memory-DB — trägt auf einer geteilten Postgres-DB nicht. Ohne
        # Paratest ist es genau der `RefreshDatabase`-Ablauf, den der
        # `backend`-Job auch fährt, nur auf der anderen Engine.
        #
        # failOnRisky/failOnWarning stehen in phpunit.xml — ein risiger Test oder
        # eine PHPUnit-Warning machen auch diesen Job rot.
        #
        # `continue-on-error` ist **entfernt**: das Gate ist jetzt blockierend.
        #
        # Es war zunächst gesetzt, und zwar **gemessen** begründet: Der erste volle
        # Lauf gegen PostgreSQL 17.10 (1465 passed / 2 failed) fand zwei
        # SQLite-Annahmen in der TEST-Suite — Stellen, die §2 im Anwendungs-Code
        # nicht verletzen, die Suite aber auf der Produktions-Engine nicht
        # lauffähig hielten. Per AGENTS.md §4 ist „vorbestehend" **kein** zulässiges
        # Label, also wurden beide behoben statt etikettiert:
        #   * `AllocationAtomicityTest` staged den Foreign-Key-Verstoß mit
        #     `PRAGMA defer_foreign_keys`. Nachgewiesen nicht portabel: die
        #     Migration erzeugt per `constrained()->cascadeOnDelete()` **kein**
        #     `DEFERRABLE` (`condeferrable = NO` im Katalog der migrierten DB,
        #     0 deferrable Constraints im ganzen Schema), und
        #     `SET CONSTRAINTS ALL DEFERRED` hebt den Check auf PG 17 nicht auf —
        #     der `UPDATE` auf eine nicht existierende mandant_id wirft trotzdem
        #     sofort `23503`. Der Test ist dort jetzt ein **dokumentierter Skip**;
        #     auf SQLite läuft er unverändert und vollständig.
        #   * `QrTokenV2Test` band seine Precondition an die feste Id 1. SQLite
        #     vergibt die rowid nach einem Rollback neu, eine Postgres-Sequence
        #     nicht → 711. Der Schlüssel wird jetzt **für die tatsächlich
        #     erzeugte Id abgeleitet** (Suche nach einem `<base>`-Kandidaten, dessen
        #     HMAC genau die beiden Parser-Bedingungen erfüllt), statt auf eine
        #     glückliche Id zu hoffen. Auf SQLite trifft der abgeleitete Schlüssel
        #     nach einem Kandidaten **byte-identisch** die alte Konstante.
        #
        # Stand beider Engines, lokal gemessen: SQLite **1468 passed / 0 skipped**,
        # PostgreSQL 17 **1467 passed / 1 skipped / 0 failed** (exit 0). Der eine
        # Skip ist der dokumentierte Guard aus Befund 1; die Suite ist damit auf
        # beiden Engines deckungsgleich, und `1468 = 1467 + 1`.
        #
        # Ein echter Hinweis für später, der mit dem Skip **nicht** behoben ist:
        # `test_a_missing_mandant_does_not_abort_the_auto_allocation_loop` ist der
        # einzige Test des Notification-Guards und läuft auf der Produktions-Engine
        # nicht. Ihn dort sichtbar zu machen ginge nur per DDL-Chirurgie am
        # Constraint (`DROP` + `ADD … NOT VALID`) — das verändert die
        # Schema-Semantik für den restlichen Test und ist bewusst unterblieben.
        run: php artisan test --no-ansi

  frontend:
    name: Frontend (Lint, Build, Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7  # major tag pin — SHA-pinning (actions/checkout@<full-sha>) is a stronger, immutable option
      - name: Setup pnpm
        uses: pnpm/action-setup@v6  # major tag pin — SHA-pinning is a stronger, immutable option
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7  # major tag pin — SHA-pinning (actions/setup-node@<full-sha>) is a stronger, immutable option
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      # prebuild (tsc -b + check-i18n) läuft automatisch vor `pnpm build`
      - name: Build
        run: pnpm build
      - name: Unit tests
        run: pnpm test:run

  e2e:
    # Keine Secrets nötig (kein Stripe/Meilisearch), daher bewusst auch auf
    # `pull_request` aktiv (AGENTS.md §7 nennt push UND PR als Gate — der Job
    # lief vorher nur bei push/schedule/workflow_dispatch, ein PR bekam also
    # NIE einen E2E-Check). Ein Job, ein Testset, zwei Fehler-Budgets — die
    # Auswahl hängt am Event bzw. am workflow_dispatch-Input (AGENTS.md §7):
    #   * push / pull_request / workflow_dispatch (Default `full`) → VOLLE
    #     Suite (alle Specs × beide Browser-Projects, inkl. `@smoke`,
    #     `@regression` und `@feature:*`) über `playwright.config.ts`,
    #     retries: 2 / maxFailures: 10 (verzeihend: geteilter Runner, echtes
    #     Netzwerk-/Timing-Rauschen)
    #   * schedule (Nightly) und workflow_dispatch mit `e2e_suite=strict` →
    #     dieselbe VOLLE Suite über `playwright.regression.config.ts`,
    #     retries: 0 / maxFailures: 1 (ausschlaggebend — der
    #     Flakiness-Detektor, siehe Run-Step)
    #   * workflow_dispatch mit `e2e_suite=smoke` → nur die `@smoke`-Specs
    #     (die lokale `test:e2e:smoke` als CI-Lauf angestoßen; kein Gate)
    # Vorher fuhr der Push-/PR-Zweig `--grep @smoke`: 26 von 84 Tests, die
    # 58 @regression-/@feature-*-Specs sahen weder Push noch PR. Und das
    # strikte Profil war ausschließlich über den 03:30-UTC-Cron erreichbar —
    # ein roter Nightly ließ sich nicht vor dem nächsten Fenster anstoßen.
    # Beides regelt der Run-Step jetzt.
    # Beide Profile teilen testDir/Projects/baseURL ⇒ identisches Testset, nur
    # unterschiedlicher Fehler-Budget.
    # Kein `continue-on-error` und kein `|| true` im Test-Step: ein roter Lauf
    # bleibt rot. (Hinweis: eine Matrix wäre hier NICHT möglich — `matrix` ist
    # in einem Job-Level-`if` nicht verfügbar, das wird vor der Expansion
    # ausgewertet.)
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # ACHTUNG `pull_request`: der Job zieht das First-Party-Image aus GHCR
    # (`container:` unten). Ein PR aus einem FORK bekommt nur ein read-only
    # `GITHUB_TOKEN`; ist `ghcr.io/reisi007/accriditation-e2e` nicht public,
    # schlägt dort der Image-Pull fehl. Voraussetzung für `pull_request` ist also
    # ein public GHCR-Package (bzw. ein `if:`-Gate auf `github.event.pull_request.head.repo.full_name`).
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Gesamter E2E-Job laeuft im Test-Image accriditation-e2e (accriditation-base
    # + Node/pnpm/Composer + Playwright-Chromium vorinstalliert) -> kein Browser-
    # Download und kein apt-Deps-Setup pro Run. Backend & Vite laufen als
    # Hintergrundprozesse im selben Container; die Daten-Dienste (postgres/
    # mailpit) sind per Service-Name erreichbar. Was das Image deterministisch
    # macht — und was nicht — steht in features/05-e2e-test-image.md.
    container:
      # First-party image. `:latest` ist der MUTABLE CI-Referenz-Tag (nur so
      # konsumiert ihn ci.yml); der Version-Tag `:<playwright-version>` wird
      # zwar ebenfalls gepusht, ist aber KEIN Reproduzierbarkeits-Garant:
      # der wöchentliche Rebuild in e2e-image.yml überschreibt ihn (gleiche
      # playwright-Version, neu gebautes Base-Image). Wer einen stabilen,
      # auditierbaren Lauf braucht, pinnt den Digest (Job-Output `image_ref`
      # in e2e-image.yml). Auch der Base-Snapshot des E2E-Images ist als Digest
      # gepinnt und als Image-Label `org.opencontainers.image.base.name`
      # nachlesbar — bit-reproduzierbar ist das Image trotzdem nicht
      # (`composer:2`, nodejs.org-`latest-v26.x`).
      image: ghcr.io/reisi007/accriditation-e2e:latest
      # ── D26: "no process leaks please" — ein Reaper als PID 1 ──────────────
      # `--init` setzt den Daemon-eigenen tini (`docker-init`) als PID 1 vor das
      # Programm, das der Runner startet. Warum HIER und nicht als ENTRYPOINT im
      # Dockerfile: der E2E-Job ist ein Job-Container, und dessen PID 1 bestimmt
      # der RUNNER, nicht das Image — ein ENTRYPOINT, den der Runner ersetzt,
      # waere eine Zeile, die nichts ueber das laufende System sagt. `--init`
      # gilt unabhaengig davon, welches Programm PID 1 wird.
      #
      # Gemessen (Docker 29.8.1, gleiche zwei Zeilen wie der Test in
      # `frontend/tests/e2e/child-lifetime.spec.ts`): ohne Reaper bleibt der
      # Waisenkind-Prozess dauerhaft auf `state=Z` in der Prozessliste, mit
      # Reaper verschwindet er ganz aus `/proc`.
      #
      # Der Reaper ersetzt die STAT-Prädikate NICHT (D26 verschärft die Zusage,
      # sie lockert sie nicht): `isExecuting`/`isZombieState` bleiben als zweite,
      # fail-closed Postcondition stehen — ein `Z` ist der Beweis, dass der
      # Reaper FEHLT. Beide Postconditions werden getestet: die Prozess-
      # Anwesenheit im Spec, die Reaper-Wirkung hier per Pin.
      options: --init
    env:
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin
      # Mailpit-API fuer die E2E-Helper (helpers/mailpit.ts liest MAILPIT_API_URL;
      # Default waere localhost:8025). Container-Modus: Dienste sind nur per
      # Service-Name erreichbar, nicht via 127.0.0.1.
      MAILPIT_API_URL: http://mailpit:8025/api/v1
      # Default = Production-Bundle via `pnpm preview`; `dev` nur für
      # Iterationsläufe (workflow_dispatch-Input).
      E2E_SERVER: ${{ github.event.inputs.e2e_server || 'preview' }}
    services:
      postgres:
        image: postgres:17-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: accriditation
          POSTGRES_USER: accriditation
          # E2E DB uses a plain dev password (owner decision: no secure password needed for E2E).
          POSTGRES_PASSWORD: accriditation
        options: >-
          --health-cmd="pg_isready -U accriditation -d accriditation"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      mailpit:
        # Aktivierungsmail aus dem E2E-Auth-Flow (@smoke). .env.example sendet
        # bereits via SMTP auf 127.0.0.1:1025 — kein env-Override nötig. API
        # (8025) wird vom MailpitHelper im E2E-Test abgefragt.
        # CC-R4: untagged → resolves to `:latest` (floating). No reproducible
        # version is pinned in this repo:
        # TODO: pin to an immutable digest (e.g. axllent/mailpit@sha256:…) for reproducible CI
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v7  # major tag pin — SHA-pinning (actions/checkout@<full-sha>) is a stronger, immutable option
      - name: Install backend dependencies
        working-directory: backend
        # Composer ist im Image (COPY --from=composer:2); PHP aus dem Test-Image
        # (accriditation-base) — kein setup-php auf dem Runner noetig.
        # Der Wegwerf-APP_KEY ist aus demselben Grund noetig wie im
        # Backend-Job: `package:discover` bootet die App, und ohne `.env` ist
        # `APP_ENV` = `production`, wo der A2-Boot-Guard ohne Key hart abbricht.
        run: APP_KEY="base64:$(head -c 32 /dev/urandom | base64)" composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare backend environment
        working-directory: backend
        run: |
          cp .env.example .env
          # Container-Modus: Dienste per Service-Name + interne Ports
          # (.env.example selbst bleibt fuer lokale Nutzung unveraendert).
          # CACHE_STORE=array: der E2E-Job laeuft die volle Suite ueber EINE IP
          # und damit ueber 40 Logins/Minute — das Login-Limit
          # (AppServiceProvider: 40/min in local/testing) laeuft sonst in einen
          # 429 und reisst sogar @smoke-Tests mit (gemessen: 6 Fehlschlaege,
          # alle "Admin API login failed with status 429"). Mit `array` ist der
          # RateLimiter pro Request zustandslos. Das Throttling-Verhalten selbst
          # deckt backend/tests/Feature/AuthThrottleTest.php ab — im E2E-Job
          # gibt es keinen Test, der ein 429 erwartet.
          #
          # QUEUE_CONNECTION=sync — EIGENE ENTSCHEIDUNG, kein Versehen, und
          # nicht dieselbe wie `phpunit.xml:117` (dort ist `sync` eine Absicht
          # fuer die Backend-Suite; hier geht es um einen anderen Stack).
          # Anlass: seit 70aa03d dispatcht `MandantMailerService::send()` nur
          # noch. `.env.example:124` liefert `QUEUE_CONNECTION=database`, dieser
          # Job startet NUR `artisan serve` (siehe Schritt "Start backend
          # server") — also legte jede Zustellung eine Zeile in `jobs` ab, die
          # niemand abarbeitete. Mailpit sah nichts und jeder Mail-Spec lief in
          # `Error: Mailpit: no message for … within 15000ms` (gemessen an
          # `auth.spec.ts` 'register → activate → login → me': 16,1 s rot; mit
          # `sync` und weiterhin totem Worker: 1,4 s gruen — dieselbe Zeile,
          # dieselbe .env, nur die Queue-Verbindung).
          #
          # WARUM sync UND KEIN WORKER: dieser Job misst Produktverhalten ueber
          # Browser/API, nicht die Queue. Der Queue-Vertrag (tries/backoff/
          # after_commit/Dead-Letter/Idempotenz-Claim) ist PHPUnit-Sache und
          # dort mit der ECHTEN `database`-Connection getestet
          # (QueuedMailTest, QueuedMailAfterCommitTest, MailDeadLetterTest,
          # Unit/SendMandantMailTest). Ein Worker hier haette der SUITE eine
          # Timing-Abhaengigkeit gegeben: jeder mailabhaengige Spec (neun,
          # gezaehlt ueber den Aufruf-Graphen: MailpitHelper direkt oder
          # ueber einen Helper, der darauf wartet — u. a. auth, profile,
          # approvals; `namespace-isolation` gehoert NICHT dazu: es ruft
          # keinen von beiden. Es liest die anderen Specs als TEXT (fs, nie
          # ausgefuehrt) und importiert aus `helpers/admin-data` ausschliesslich
          # DATEN-Konstanten (`E2E_PURGE_*`, die es nur spreadet) — also keine
          # Helfer-Funktion, die zustellen koennte. Beleg fuer den Ausschluss,
          # korrigiert 2026-10-03 (L4): sein EINZIGER case-insensitiver
          # "mail"-Treffer ist `namespace-isolation.spec.ts:837`, und das ist das
          # Wort "email" in einem Kommentar ueber User-Handles — kein
          # Zustellungsbezug (`grep -nE "mailpit|Mailpit|extractActivation"` dort
          # = null Treffer). Die zuvor genannten Zeilen :941-942 (ein Kommentar
          # ueber `registerUploadPortraitAndApply`) und :961-965 (die
          # `FIXTURE_CREATORS`-Strings) enthalten gar kein "mail" und waren damit
          # kein Beleg; die Schlussfolgerung war richtig, der Beleg nicht —
          # exakt die Fehlerklasse, die der Mail-Zaehlkorrektur von 0be8382 zugrunde
          # lag) muesste auf einen
          # Hintergrundprozess warten, und jeder Retry-Puls des
          # Workers waere ein Flake-Budget, das die Produktzusage nicht
          # verdient. Mit `sync` ist die Zustellung VOLLSTAENDIG, bevor die
          # HTTP-Antwort herausgeht — der Mailpit-Poll ist damit ein Timeout,
          # kein Rennen.
          #
          # WAS DAS KOSTET (bewusst benannt, nicht versteckt):
          #   * `config/queue.php` traegt `after_commit => true` NUR auf der
          #     `database`-Connection (`sync` hat den Schluessel nicht), der
          #     Job-Body laeuft mit `sync` also innerhalb der offenen
          #     Transaktion. "Eine zurueckgerollte Entscheidung sendet keine
          #     Mail" wird im E2E-Job damit NICHT beobachtet — das ist
          #     Backend-Suite (QueuedMailAfterCommitTest), nicht
          #     Browser-Verhalten.
          #   * `jobs` bleibt in diesem Stack leer: der asynchrone Dispatch
          #     selbst wird im E2E-Job nicht gesehen.
          #   * Dafuer scheitert ein kaputter Relay laut statt still: mit
          #     `sync` wirft `SendMandantMail` in der ausloesenden Anfrage
          #     (HTTP 500), mit `database` bliebe eine Zeile in `jobs` liegen
          #     und der Spec sahe nur ein 15-s-Timeout.
          sed -i.bak -E \
            -e 's|^DB_HOST=.*|DB_HOST=postgres|' \
            -e 's|^DB_PORT=.*|DB_PORT=5432|' \
            -e 's|^MAIL_HOST=.*|MAIL_HOST=mailpit|' \
            -e 's|^MAIL_PORT=.*|MAIL_PORT=1025|' \
            -e 's|^CACHE_STORE=.*|CACHE_STORE=array|' \
            -e 's|^QUEUE_CONNECTION=.*|QUEUE_CONNECTION=sync|' \
            .env && rm -f .env.bak
          grep -q '^DB_HOST=postgres$' .env
          grep -q '^DB_PORT=5432$' .env
          grep -q '^MAIL_HOST=mailpit$' .env
          grep -q '^MAIL_PORT=1025$' .env
          grep -q '^CACHE_STORE=array$' .env
          grep -q '^QUEUE_CONNECTION=sync$' .env
      - name: Generate app key
        working-directory: backend
        run: php artisan key:generate
      - name: Generate JWT secret
        working-directory: backend
        run: php artisan jwt:secret --force
      - name: Run migrations
        working-directory: backend
        run: php artisan migrate --force
      - name: Seed database
        working-directory: backend
        # DatabaseSeeder legt den Admin via firstOrCreate mit
        # ADMIN_EMAIL/ADMIN_PASSWORD an (Standard aus .env.example).
        run: php artisan db:seed --force
      - name: Start backend server
        working-directory: backend
        run: |
          # --no-reload: ohne den Flag filtert `serve` Env-Vars bei existierender
          # .env (Portal-Lektion) — mit Flag startet der Server mit allen Vars.
          #
          # Bewusst NUR der HTTP-Server. Der Mail-Worker ist hier kein fehlendes
          # Detail, sondern eine bewusste Entscheidung: der Job laeuft mit
          # `QUEUE_CONNECTION=sync` (Schritt "Prepare backend environment",
          # Begruendung dort), also laeuft die Zustellung im Request. Ein
          # `queue:work` neben diesem Server wuerde die Suite von einem
          # Hintergrundprozess abhaengig machen, ohne ein Produktverhalten zu
          # messen, das nicht die Backend-Suite (PHPUnit) bereits deckt.
          php artisan serve --host=127.0.0.1 --port=8000 --no-reload > /tmp/php-serve.log 2>&1 &
          timeout 60s bash -c 'until curl -sf http://127.0.0.1:8000/up > /dev/null; do sleep 1; done'
      - name: Setup pnpm
        uses: pnpm/action-setup@v6  # major tag pin — SHA-pinning is a stronger, immutable option
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7  # major tag pin — SHA-pinning (actions/setup-node@<full-sha>) is a stronger, immutable option
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Verify Playwright browsers (fallback install)
        working-directory: frontend
        # Browser sind im Image unter /ms-playwright vorinstalliert (Version ==
        # @playwright/test). Dieser Schritt ist ein No-Op, wenn die Version
        # passt; bei Versionsdrift (Dependabot-Bump vor Image-Rebuild) laedt er
        # nur die fehlende Browser-Version nach. `--with-deps` bewusst NICHT:
        # apt-System-Deps sind im Image gebacken.
        run: npx playwright install chromium
      - name: Build frontend (production bundle)
        working-directory: frontend
        if: env.E2E_SERVER == 'preview'
        # Der E2E-Gate testet das PRODUKTIONS-Bundle, nicht den Dev-Server.
        # `frontend/AGENTS.md` (Lingui / no module-scope `t`) dokumentiert einen
        # Blank-Page-Crash, der NUR im gebauten Bundle auftritt — der
        # Dev-Server (native ESM) verdeckt ihn. Vorher lief nur `pnpm dev`.
        # `prebuild` (tsc -b + check-i18n) läuft automatisch mit.
        # VITE_API_PROXY wird hier bewusst NICHT gesetzt: es wird in
        # vite.config.ts erst beim Start des Preview-Prozesses gelesen
        # (Config-Lade-Zeitpunkt) und niemals in den Bundle geschrieben.
        run: pnpm build
      - name: Start frontend preview server (production bundle)
        working-directory: frontend
        if: env.E2E_SERVER == 'preview'
        run: |
          pnpm preview > /tmp/vite-preview.log 2>&1 &
          timeout 60s bash -c 'until curl -sf http://localhost:5173/ > /dev/null; do sleep 1; done'
        env:
          # Gelesen von vite.config.ts (`preview.proxy['/api'].target`) beim
          # Start dieses Schritts — ohne das erreicht das Bundle den
          # Laravel-Server nicht (relatives /api, kein absoluter API-Origin
          # im Bundle).
          VITE_API_PROXY: http://127.0.0.1:8000
      - name: Start frontend dev server
        working-directory: frontend
        # Nur für workflow_dispatch mit `e2e_server=dev` (schnelle
        # Iterationsläufe). Kein Gate — der Default ist `preview`.
        if: env.E2E_SERVER == 'dev'
        run: |
          pnpm dev > /tmp/vite.log 2>&1 &
          timeout 60s bash -c 'until curl -sf http://localhost:5173/ > /dev/null; do sleep 1; done'
        env:
          VITE_API_PROXY: http://127.0.0.1:8000
      - name: Run E2E-Suite (${{ (github.event_name == 'schedule' || inputs.e2e_suite == 'strict') && 'volle Suite, strikt' || (inputs.e2e_suite == 'smoke' && 'nur @smoke' || 'volle Suite, verzeihend') }})
        working-directory: frontend
        # Serial (--workers=1) in BEIDEN Profilen: Backend-Login-Limiter
        # (RateLimiter::for('login'), 40/min pro IP laut AppServiceProvider —
        # das ist der local/testing-Floor, in production gelten 15/min) →
        # parallel workers teilen sich die CI-IP und erzeugen 429
        # Too-Many-Attempts-Flakes (P2b-F9). Serial läuft grün.
        #
        # Zwei Laufprofile, EIN Testset (gleiche testDir/Projects/baseURL) —
        # Unterschied ist nur das Fehler-Budget, nicht die Abdeckung:
        #   * `schedule` ODER `e2e_suite=strict` → VOLLE Suite über
        #     playwright.regression.config.ts (retries: 0, maxFailures: 1).
        #     Dieser Lauf ist der Flakiness-Detektor: **Rot heißt „ein Test ist
        #     flaky oder echt kaputt"** — nicht „ignorieren". Er wird behoben
        #     (oder mit Datei/Testname + Ursache in AGENTS.todo.md begründet),
        #     und ausdrücklich NICHT mit Retries bzw. einem höheren maxFailures
        #     wegkonfiguriert — genau das hat den Gate vorher blind gemacht.
        #     Der `schedule`-Zweig war historisch der einzige Weg dorthin; über
        #     `e2e_suite=strict` ist der strikte Lauf jetzt jederzeit per
        #     `gh workflow run` reproduzierbar.
        #   * `e2e_suite=smoke` → nur die `@smoke`-Specs über
        #     playwright.config.ts (schnelle Iterationsläufe, kein Gate).
        #   * sonst (push / pull_request / `e2e_suite=full`) → VOLLE Suite
        #     über playwright.config.ts, retries: 2, maxFailures: 10; dieses
        #     Profil bleibt bewusst verzeihend. Bis hierher fuhr dieser Zweig
        #     `--grep @smoke`, d. h. 58 @regression-/@feature:*-Tests sahen CI
        #     nie.
        # `${{ inputs.* }}` ist bei `push`/`pull_request` leer (dort existiert
        # kein Input) — der leere Vergleich gegen 'strict'/'smoke' ist false
        # und landet korrekt im `else`.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = 'schedule' ] || [ "${{ inputs.e2e_suite }}" = 'strict' ]; then
            pnpm exec playwright test -c playwright.regression.config.ts --workers=1
          elif [ "${{ inputs.e2e_suite }}" = 'smoke' ]; then
            pnpm exec playwright test --workers=1 --grep @smoke
          else
            pnpm exec playwright test --workers=1
          fi
        env:
          CI: '1'
      - name: Upload Playwright report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7  # major tag pin — SHA-pinning is a stronger, immutable option
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
