name: CI

# Push auf ALLE Branches + Pull Requests. Backend/Frontend laufen überall;
# der E2E-Job läuft nur bei `push`/`workflow_dispatch` (keine externen Secrets
# nötig, aber bewusst schlank gehalten — Smoke-Suite, kein Meilisearch,
# kein Stripe in diesem Projekt).
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PHPUnit + Pint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mailpit:
        # phpunit.xml sendet via SMTP auf 127.0.0.1:1025. Die Mailable-Tests
        # nutzen Mail::fake, aber Mailpit als Real-Backend ist ein Sicherheitsnetz
        # für nicht-gefakte Mail-Zustellung (und deckt das Dev-Setup ab).
        # CC-R4: untagged → resolves to `:latest` (floating). No reproducible
        # version is pinned in this repo:
        # TODO: pin to an immutable digest (e.g. axllent/mailpit@sha256:…) for reproducible CI
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v5  # major tag pin — SHA-pinning (actions/checkout@<full-sha>) is a stronger, immutable option
      - name: Setup PHP
        uses: shivammathur/setup-php@v2  # major tag pin — SHA-pinning is a stronger, immutable option
        with:
          php-version: 8.5
          extensions: mbstring, pgsql, pdo_pgsql, pdo_sqlite, dom, gd, zip
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: cp .env.example .env
      - name: Generate app key
        run: php artisan key:generate
      - name: Generate JWT secret
        run: php artisan jwt:secret --force
      - name: Run PHPUnit
        run: php artisan test --no-ansi
      - name: Pint (code style)
        run: vendor/bin/pint --test

  frontend:
    name: Frontend (Lint, Build, Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5  # major tag pin — SHA-pinning (actions/checkout@<full-sha>) is a stronger, immutable option
      - name: Setup pnpm
        uses: pnpm/action-setup@v6  # major tag pin — SHA-pinning is a stronger, immutable option
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5  # major tag pin — SHA-pinning (actions/setup-node@<full-sha>) is a stronger, immutable option
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      # prebuild (tsc -b + check-i18n) läuft automatisch vor `pnpm build`
      - name: Build
        run: pnpm build
      - name: Unit tests
        run: pnpm test:run

  e2e:
    # Keine Secrets nötig (kein Stripe/Meilisearch), daher bewusst nur bei
    # push/workflow_dispatch. Smoke-Suite: SPA-Render + Sprachumschalter.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: E2E (Playwright Smoke)
    runs-on: ubuntu-latest
    # Gesamter E2E-Job laeuft im Test-Image accriditation-e2e (accriditation-base
    # + Node/pnpm/Composer + Playwright-Chromium vorinstalliert) -> kein Browser-
    # Download und kein apt-Deps-Setup pro Run. Backend & Vite laufen als
    # Hintergrundprozesse im selben Container; die Daten-Dienste (postgres/
    # mailpit) sind per Service-Name erreichbar. Details: features/05-e2e-test-image.md.
    container:
      # First-party image; the immutable `:<playwright-version>` tag is also
      # pushed (see .github/workflows/e2e-image.yml) for reproducible,
      # rollback-safe runs. `:latest` here is the documented CI reference.
      image: ghcr.io/reisi007/accriditation-e2e:latest
    env:
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin
      # Mailpit-API fuer die E2E-Helper (helpers/mailpit.ts liest MAILPIT_API_URL;
      # Default waere localhost:8025). Container-Modus: Dienste sind nur per
      # Service-Name erreichbar, nicht via 127.0.0.1.
      MAILPIT_API_URL: http://mailpit:8025/api/v1
    services:
      postgres:
        image: postgres:17-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: accriditation
          POSTGRES_USER: accriditation
          # Source the E2E DB password from the E2E_POSTGRES_PASSWORD GitHub
          # secret (repo settings → Secrets and variables → Actions). The
          # fallback keeps CI green until the owner configures the secret.
          POSTGRES_PASSWORD: ${{ secrets.E2E_POSTGRES_PASSWORD || 'accriditation' }}
        options: >-
          --health-cmd="pg_isready -U accriditation -d accriditation"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      mailpit:
        # Aktivierungsmail aus dem E2E-Auth-Flow (@smoke). .env.example sendet
        # bereits via SMTP auf 127.0.0.1:1025 — kein env-Override nötig. API
        # (8025) wird vom MailpitHelper im E2E-Test abgefragt.
        # CC-R4: untagged → resolves to `:latest` (floating). No reproducible
        # version is pinned in this repo:
        # TODO: pin to an immutable digest (e.g. axllent/mailpit@sha256:…) for reproducible CI
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v5  # major tag pin — SHA-pinning (actions/checkout@<full-sha>) is a stronger, immutable option
      - name: Install backend dependencies
        working-directory: backend
        # Composer ist im Image (COPY --from=composer:2); PHP aus dem Test-Image
        # (accriditation-base) — kein setup-php auf dem Runner noetig.
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare backend environment
        working-directory: backend
        run: |
          cp .env.example .env
          # Container-Modus: Dienste per Service-Name + interne Ports
          # (.env.example selbst bleibt fuer lokale Nutzung unveraendert).
          sed -i.bak -E \
            -e 's|^DB_HOST=.*|DB_HOST=postgres|' \
            -e 's|^DB_PORT=.*|DB_PORT=5432|' \
            -e 's|^MAIL_HOST=.*|MAIL_HOST=mailpit|' \
            -e 's|^MAIL_PORT=.*|MAIL_PORT=1025|' \
            .env && rm -f .env.bak
          grep -q '^DB_HOST=postgres$' .env
          grep -q '^DB_PORT=5432$' .env
          grep -q '^MAIL_HOST=mailpit$' .env
          grep -q '^MAIL_PORT=1025$' .env
      - name: Generate app key
        working-directory: backend
        run: php artisan key:generate
      - name: Generate JWT secret
        working-directory: backend
        run: php artisan jwt:secret --force
      - name: Run migrations
        working-directory: backend
        run: php artisan migrate --force
      - name: Seed database
        working-directory: backend
        # DatabaseSeeder legt den Admin via firstOrCreate mit
        # ADMIN_EMAIL/ADMIN_PASSWORD an (Standard aus .env.example).
        run: php artisan db:seed --force
      - name: Start backend server
        working-directory: backend
        run: |
          # --no-reload: ohne den Flag filtert `serve` Env-Vars bei existierender
          # .env (Portal-Lektion) — mit Flag startet der Server mit allen Vars.
          php artisan serve --host=127.0.0.1 --port=8000 --no-reload > /tmp/php-serve.log 2>&1 &
          timeout 60s bash -c 'until curl -sf http://127.0.0.1:8000/up > /dev/null; do sleep 1; done'
      - name: Setup pnpm
        uses: pnpm/action-setup@v6  # major tag pin — SHA-pinning is a stronger, immutable option
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5  # major tag pin — SHA-pinning (actions/setup-node@<full-sha>) is a stronger, immutable option
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Verify Playwright browsers (fallback install)
        working-directory: frontend
        # Browser sind im Image unter /ms-playwright vorinstalliert (Version ==
        # @playwright/test). Dieser Schritt ist ein No-Op, wenn die Version
        # passt; bei Versionsdrift (Dependabot-Bump vor Image-Rebuild) laedt er
        # nur die fehlende Browser-Version nach. `--with-deps` bewusst NICHT:
        # apt-System-Deps sind im Image gebacken.
        run: npx playwright install chromium
      - name: Start frontend dev server
        working-directory: frontend
        run: |
          pnpm dev > /tmp/vite.log 2>&1 &
          timeout 60s bash -c 'until curl -sf http://localhost:5173/ > /dev/null; do sleep 1; done'
        env:
          VITE_API_PROXY: http://127.0.0.1:8000
      - name: Run E2E smoke tests
        working-directory: frontend
        # Serial (--workers=1): Backend-Login-Limiter (RateLimiter::for('login'),
        # 10/min pro IP) → parallel workers teilen sich die CI-IP und erzeugen
        # 429 "Too Many Attempts"-Flakes (P2b-F9). Serial läuft grün.
        run: pnpm exec playwright test --grep @smoke --workers=1
        env:
          CI: '1'
      - name: Upload Playwright report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7  # major tag pin — SHA-pinning is a stronger, immutable option
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
