name: CI

# Push auf ALLE Branches + Pull Requests. Backend/Frontend laufen überall;
# der E2E-Job läuft nur bei `push`/`schedule`/`workflow_dispatch` (keine
# externen Secrets nötig, aber bewusst schlank gehalten — kein Meilisearch,
# kein Stripe in diesem Projekt). `schedule` zieht die VOLLE E2E-Suite
# (AGENTS.md §7: „`@regression` … vor Deployment") — auf `push`/`PR` läuft
# nur `@smoke`.
on:
  push:
  pull_request:
  # Nightly: die volle Suite (Smoke + @regression + @feature:*). Ohne diesen
  # Cron lief in CI ausschließlich @smoke — der in AGENTS.md §7 geforderte
  # Regression-Lauf war nirgends durchgesetzt.
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      e2e_server:
        description: 'Welchen Frontend-Server soll der E2E-Job testen? (preview = Production-Bundle, dev = Dev-Server für schnelle Iterationsläufe)'
        type: choice
        default: preview
        options:
          - preview
          - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PHPUnit + Pint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mailpit:
        # phpunit.xml sendet via SMTP auf 127.0.0.1:1025. Die Mailable-Tests
        # nutzen Mail::fake, aber Mailpit als Real-Backend ist ein Sicherheitsnetz
        # für nicht-gefakte Mail-Zustellung (und deckt das Dev-Setup ab).
        # CC-R4: untagged → resolves to `:latest` (floating). No reproducible
        # version is pinned in this repo:
        # TODO: pin to an immutable digest (e.g. axllent/mailpit@sha256:…) for reproducible CI
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v7  # major tag pin — SHA-pinning (actions/checkout@<full-sha>) is a stronger, immutable option
      - name: Setup PHP
        uses: shivammathur/setup-php@v2  # major tag pin — SHA-pinning is a stronger, immutable option
        with:
          php-version: 8.5
          extensions: mbstring, pgsql, pdo_pgsql, pdo_sqlite, dom, gd, zip
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: cp .env.example .env
      # Die beiden Key-Schritte sind für die Testsuite NICHT mehr die Quelle der
      # Wahrheit: `backend/phpunit.xml` pinnt inzwischen einen festen
      # TEST-ONLY-APP_KEY und JWT_SECRET, die Test-Suite ist also unabhängig von
      # der `.env`. Die Schritte bleiben als Absicherung für alles, was die
      # `.env` liest ( artisan config:clear im `composer test`-Script u. ä.).
      - name: Generate app key
        run: php artisan key:generate
      - name: Generate JWT secret
        run: php artisan jwt:secret --force
      - name: Run PHPUnit
        # failOnRisky/failOnWarning stehen in phpunit.xml — ein risiger Test
        # (z. B. ohne Assertion) oder eine PHPUnit-Warning machen den Job rot.
        run: php artisan test --no-ansi
      - name: Pint (code style)
        run: vendor/bin/pint --test

  frontend:
    name: Frontend (Lint, Build, Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7  # major tag pin — SHA-pinning (actions/checkout@<full-sha>) is a stronger, immutable option
      - name: Setup pnpm
        uses: pnpm/action-setup@v6  # major tag pin — SHA-pinning is a stronger, immutable option
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7  # major tag pin — SHA-pinning (actions/setup-node@<full-sha>) is a stronger, immutable option
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      # prebuild (tsc -b + check-i18n) läuft automatisch vor `pnpm build`
      - name: Build
        run: pnpm build
      - name: Unit tests
        run: pnpm test:run

  e2e:
    # Keine Secrets nötig (kein Stripe/Meilisearch), daher bewusst nur bei
    # push/schedule/workflow_dispatch. Ein Job, zwei Suiten — die Auswahl
    # hängt am Event (AGENTS.md §7):
    #   * push / pull_request  → `@smoke` (Critical Path, schnell)
    #   * schedule (Nightly)   → VOLLE Suite (alle Specs × beide Browser-
    #     Projects, inkl. aller `@regression`- und `@feature:*`-Specs; lokal
    #     gemessen: 80 Test-Slots, davon 36 zur Laufzeit übersprungen). Vorher
    #     lief in CI ausschließlich `@smoke` — der in §7 geforderte
    #     Regression-Lauf war nirgends durchgesetzt.
    # Kein `continue-on-error` und kein `|| true` im Test-Step: ein roter Lauf
    # bleibt rot. (Hinweis: eine Matrix wäre hier NICHT möglich — `matrix` ist
    # in einem Job-Level-`if` nicht verfügbar, das wird vor der Expansion
    # ausgewertet.)
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Gesamter E2E-Job laeuft im Test-Image accriditation-e2e (accriditation-base
    # + Node/pnpm/Composer + Playwright-Chromium vorinstalliert) -> kein Browser-
    # Download und kein apt-Deps-Setup pro Run. Backend & Vite laufen als
    # Hintergrundprozesse im selben Container; die Daten-Dienste (postgres/
    # mailpit) sind per Service-Name erreichbar. Was das Image deterministisch
    # macht — und was nicht — steht in features/05-e2e-test-image.md.
    container:
      # First-party image. `:latest` ist der MUTABLE CI-Referenz-Tag (nur so
      # konsumiert ihn ci.yml); der Version-Tag `:<playwright-version>` wird
      # zwar ebenfalls gepusht, ist aber KEIN Reproduzierbarkeits-Garant:
      # der wöchentliche Rebuild in e2e-image.yml überschreibt ihn (gleiche
      # playwright-Version, neu gebautes Base-Image). Wer einen stabilen,
      # auditierbaren Lauf braucht, pinnt den Digest (Job-Output `image_ref`
      # in e2e-image.yml). Auch der Base-Snapshot des E2E-Images ist als Digest
      # gepinnt und als Image-Label `org.opencontainers.image.base.name`
      # nachlesbar — bit-reproduzierbar ist das Image trotzdem nicht
      # (`composer:2`, nodejs.org-`latest-v26.x`).
      image: ghcr.io/reisi007/accriditation-e2e:latest
    env:
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin
      # Mailpit-API fuer die E2E-Helper (helpers/mailpit.ts liest MAILPIT_API_URL;
      # Default waere localhost:8025). Container-Modus: Dienste sind nur per
      # Service-Name erreichbar, nicht via 127.0.0.1.
      MAILPIT_API_URL: http://mailpit:8025/api/v1
      # Default = Production-Bundle via `pnpm preview`; `dev` nur für
      # Iterationsläufe (workflow_dispatch-Input).
      E2E_SERVER: ${{ github.event.inputs.e2e_server || 'preview' }}
    services:
      postgres:
        image: postgres:17-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: accriditation
          POSTGRES_USER: accriditation
          # E2E DB uses a plain dev password (owner decision: no secure password needed for E2E).
          POSTGRES_PASSWORD: accriditation
        options: >-
          --health-cmd="pg_isready -U accriditation -d accriditation"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      mailpit:
        # Aktivierungsmail aus dem E2E-Auth-Flow (@smoke). .env.example sendet
        # bereits via SMTP auf 127.0.0.1:1025 — kein env-Override nötig. API
        # (8025) wird vom MailpitHelper im E2E-Test abgefragt.
        # CC-R4: untagged → resolves to `:latest` (floating). No reproducible
        # version is pinned in this repo:
        # TODO: pin to an immutable digest (e.g. axllent/mailpit@sha256:…) for reproducible CI
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v7  # major tag pin — SHA-pinning (actions/checkout@<full-sha>) is a stronger, immutable option
      - name: Install backend dependencies
        working-directory: backend
        # Composer ist im Image (COPY --from=composer:2); PHP aus dem Test-Image
        # (accriditation-base) — kein setup-php auf dem Runner noetig.
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare backend environment
        working-directory: backend
        run: |
          cp .env.example .env
          # Container-Modus: Dienste per Service-Name + interne Ports
          # (.env.example selbst bleibt fuer lokale Nutzung unveraendert).
          # CACHE_STORE=array: der E2E-Job laeuft die volle Suite ueber EINE IP
          # und damit ueber 40 Logins/Minute — das Login-Limit
          # (AppServiceProvider: 40/min in local/testing) laeuft sonst in einen
          # 429 und reisst sogar @smoke-Tests mit (gemessen: 6 Fehlschlaege,
          # alle "Admin API login failed with status 429"). Mit `array` ist der
          # RateLimiter pro Request zustandslos. Das Throttling-Verhalten selbst
          # deckt backend/tests/Feature/AuthThrottleTest.php ab — im E2E-Job
          # gibt es keinen Test, der ein 429 erwartet.
          sed -i.bak -E \
            -e 's|^DB_HOST=.*|DB_HOST=postgres|' \
            -e 's|^DB_PORT=.*|DB_PORT=5432|' \
            -e 's|^MAIL_HOST=.*|MAIL_HOST=mailpit|' \
            -e 's|^MAIL_PORT=.*|MAIL_PORT=1025|' \
            -e 's|^CACHE_STORE=.*|CACHE_STORE=array|' \
            .env && rm -f .env.bak
          grep -q '^DB_HOST=postgres$' .env
          grep -q '^DB_PORT=5432$' .env
          grep -q '^MAIL_HOST=mailpit$' .env
          grep -q '^MAIL_PORT=1025$' .env
          grep -q '^CACHE_STORE=array$' .env
      - name: Generate app key
        working-directory: backend
        run: php artisan key:generate
      - name: Generate JWT secret
        working-directory: backend
        run: php artisan jwt:secret --force
      - name: Run migrations
        working-directory: backend
        run: php artisan migrate --force
      - name: Seed database
        working-directory: backend
        # DatabaseSeeder legt den Admin via firstOrCreate mit
        # ADMIN_EMAIL/ADMIN_PASSWORD an (Standard aus .env.example).
        run: php artisan db:seed --force
      - name: Start backend server
        working-directory: backend
        run: |
          # --no-reload: ohne den Flag filtert `serve` Env-Vars bei existierender
          # .env (Portal-Lektion) — mit Flag startet der Server mit allen Vars.
          php artisan serve --host=127.0.0.1 --port=8000 --no-reload > /tmp/php-serve.log 2>&1 &
          timeout 60s bash -c 'until curl -sf http://127.0.0.1:8000/up > /dev/null; do sleep 1; done'
      - name: Setup pnpm
        uses: pnpm/action-setup@v6  # major tag pin — SHA-pinning is a stronger, immutable option
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7  # major tag pin — SHA-pinning (actions/setup-node@<full-sha>) is a stronger, immutable option
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Verify Playwright browsers (fallback install)
        working-directory: frontend
        # Browser sind im Image unter /ms-playwright vorinstalliert (Version ==
        # @playwright/test). Dieser Schritt ist ein No-Op, wenn die Version
        # passt; bei Versionsdrift (Dependabot-Bump vor Image-Rebuild) laedt er
        # nur die fehlende Browser-Version nach. `--with-deps` bewusst NICHT:
        # apt-System-Deps sind im Image gebacken.
        run: npx playwright install chromium
      - name: Build frontend (production bundle)
        working-directory: frontend
        if: env.E2E_SERVER == 'preview'
        # Der E2E-Gate testet das PRODUKTIONS-Bundle, nicht den Dev-Server.
        # `frontend/AGENTS.md` (Lingui / no module-scope `t`) dokumentiert einen
        # Blank-Page-Crash, der NUR im gebauten Bundle auftritt — der
        # Dev-Server (native ESM) verdeckt ihn. Vorher lief nur `pnpm dev`.
        # `prebuild` (tsc -b + check-i18n) läuft automatisch mit.
        # VITE_API_PROXY wird hier bewusst NICHT gesetzt: es wird in
        # vite.config.ts erst beim Start des Preview-Prozesses gelesen
        # (Config-Lade-Zeitpunkt) und niemals in den Bundle geschrieben.
        run: pnpm build
      - name: Start frontend preview server (production bundle)
        working-directory: frontend
        if: env.E2E_SERVER == 'preview'
        run: |
          pnpm preview > /tmp/vite-preview.log 2>&1 &
          timeout 60s bash -c 'until curl -sf http://localhost:5173/ > /dev/null; do sleep 1; done'
        env:
          # Gelesen von vite.config.ts (`preview.proxy['/api'].target`) beim
          # Start dieses Schritts — ohne das erreicht das Bundle den
          # Laravel-Server nicht (relatives /api, kein absoluter API-Origin
          # im Bundle).
          VITE_API_PROXY: http://127.0.0.1:8000
      - name: Start frontend dev server
        working-directory: frontend
        # Nur für workflow_dispatch mit `e2e_server=dev` (schnelle
        # Iterationsläufe). Kein Gate — der Default ist `preview`.
        if: env.E2E_SERVER == 'dev'
        run: |
          pnpm dev > /tmp/vite.log 2>&1 &
          timeout 60s bash -c 'until curl -sf http://localhost:5173/ > /dev/null; do sleep 1; done'
        env:
          VITE_API_PROXY: http://127.0.0.1:8000
      - name: Run E2E suite (${{ github.event_name == 'schedule' && 'volle Suite' || '@smoke' }})
        working-directory: frontend
        # Serial (--workers=1): Backend-Login-Limiter (RateLimiter::for('login'),
        # 40/min pro IP laut AppServiceProvider — das ist der local/testing-
        # Floor, in production gelten 15/min) → parallel workers teilen sich
        # die CI-IP und erzeugen 429 Too-Many-Attempts-Flakes (P2b-F9).
        # Serial läuft grün.
        # `schedule` = volle Suite (kein `--grep`), sonst `@smoke`.
        run: |
          set -euo pipefail
          args=(--workers=1)
          if [ "${{ github.event_name }}" != 'schedule' ]; then args+=(--grep @smoke); fi
          pnpm exec playwright test "${args[@]}"
        env:
          CI: '1'
      - name: Upload Playwright report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7  # major tag pin — SHA-pinning is a stronger, immutable option
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
