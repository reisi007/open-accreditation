name: Build and Push accriditation-e2e Image

# accriditation-e2e = E2E-/Test-Image (accriditation-base + Node/pnpm/Composer +
# Playwright-Chromium vorinstalliert). Die E2E-CI (ci.yml, Job `e2e`) laeuft
# komplett in diesem Image -> kein Browser-Download und kein apt-Deps-Setup
# pro Run (Details: features/05-e2e-test-image.md).
#
# Rebuild-Trigger (Playwright-Browser sind an die @playwright/test-Version
# gebunden!):
#   * Push auf main bei Aenderung von `deployment/**` (Build-Kontext UND
#     Dockerfile.e2e), von `frontend/pnpm-lock.yaml` ODER von
#     `frontend/package.json` (Dependabot-Bumps -> Image muss nachziehen)
#   * Weekly (Mo 02:00 UTC) als Frische-Untergrenze
#   * workflow_dispatch manuell
#
# Basis-Image (WP-9-D1): vor dem Build wird der Digest aufgeloest, auf den
# `accriditation-base:8.5` gerade zeigt, und als `BASE_REF` durchgereicht — der
# tatsaechlich benutzte Wert landet als Image-Label
# `org.opencontainers.image.base.name` im Ergebnis. Schlaegt die Aufloesung fehl,
# laeuft der Build gegen den beweglichen Tag weiter (mit `::warning::`, nicht
# still). Ein Rebuild hier triggert KEINEN base-image.yml-Lauf: nach einem
# nightly Base-Rebuild laeuft die E2E-CI bis zum naechsten woechentlichen
# Rebuild dieses Workflows auf dem aelteren E2E-Image. Was das Image wirklich
# garantiert, steht im Determinismus-Absatz von deployment/Dockerfile.e2e —
# bitte dort nachlesen statt hier eine Staerke zu vermuten.
on:
  push:
    branches: [ "main" ]
    # ------------------------------------------------------------------------
    # Include-Liste (`paths`), BEWUSST kein `paths-ignore` — Abweichung vom
    # Skill `github-ci-filters` (Schritt 2), hier gemessen begründet. Die
    # ausführliche Begründung steht in `base-image.yml` (gleiche Form, gleiche
    # Gründe); der eine Unterschied ist, dass dieser Workflow zusätzlich Dateien
    # AUSSERHALB des Build-Kontexts liest — der `versions`-Step unten zieht
    # ZWEI Dateien per `sed`:
    #   * `frontend/pnpm-lock.yaml` -> `PLAYWRIGHT_VERSION`  (war gelistet)
    #   * `frontend/package.json`   -> `PNPM_VERSION` aus dem `packageManager`-Pin
    #                                    (war NICHT gelistet)
    # Ein `paths-ignore` könnte die beiden nicht von `frontend/**` ausnehmen —
    # es kennt keine Negation — und würde damit jeden Frontend-Commit einen
    # Image-Build plus Tag-Push auf `:latest` auslösen. Genau der Fall, den
    # der Nightly nur mit bis zu 7 Tagen Latenz auffängt.
    # ------------------------------------------------------------------------
    paths:
      - 'deployment/**'
      - 'frontend/pnpm-lock.yaml'
      - 'frontend/package.json'
      - '.github/workflows/e2e-image.yml'
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # Immutable Referenz dieses Builds (`<image>@<digest>`), damit Konsumenten
      # nicht auf den beweglichen `:latest`-Tag pinnen müssen.
      image_ref: ${{ steps.publish.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v7  # major tag pin — SHA-pinning (actions/checkout@<full-sha>) is a stronger, immutable option

      - name: Extract build args from repository
        id: versions
        run: |
          # Exakte aufgeloeste Version aus dem Lockfile (package.json kann
          # einen Caret-Range tragen, z.B. ^1.61.1 -> 1.62.1 im Lockfile).
          PLAYWRIGHT_VERSION="$(sed -n "s/.*'@playwright\/test@\([0-9][0-9.]*\)':.*/\1/p" frontend/pnpm-lock.yaml | head -n1)"
          PNPM_VERSION="$(sed -n 's/.*"packageManager"[[:space:]]*:[[:space:]]*"pnpm@\([0-9][0-9.]*\)".*/\1/p' frontend/package.json | head -n1)"
          [ -n "$PLAYWRIGHT_VERSION" ] || { echo "::error::@playwright/test Version nicht in frontend/pnpm-lock.yaml gefunden"; exit 1; }
          [ -n "$PNPM_VERSION" ] || { echo "::error::packageManager (pnpm) nicht in frontend/package.json gefunden"; exit 1; }
          echo "playwright_version=${PLAYWRIGHT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "pnpm_version=${PNPM_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@v4  # major tag pin — SHA-pinning is a stronger, immutable option
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4  # major tag pin — SHA-pinning is a stronger, immutable option

      - name: Resolve base image reference (digest pass-through)
        id: base
        env:
          BASE_IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/accriditation-base
          BASE_TAG: ${{ env.REGISTRY }}/${{ env.OWNER }}/accriditation-base:8.5
        run: |
          set -euo pipefail
          # Steht bewusst NACH `docker/login-action`: die Auflösung geht über die
          # Registry und soll auch dann klappen, wenn das Paket einmal nicht
          # öffentlich ist — der Login ist dann schon da.
          #
          # Warum der Digest zur Build-Zeit aus der Registry und nicht aus dem
          # Job-Output von `base-image.yml` (WP-9-D1):
          #   * `image_ref`=<image>@sha256:<digest> ist DER Wert, den der Tag
          #     `:8.5` gerade aufloest — ein Push setzt Tag und Digest, die
          #     beiden koennen per Konstruktion nicht auseinanderlaufen.
          #   * Einen Job-Output workflow-uebergreifend zu konsumieren ginge nur
          #     ueber `workflow_run` + Download-Artefakt; das (a) feuert nicht bei
          #     den E2E-Triggern (Dockerfile.e2e / pnpm-lock.yaml) mit, (b) ist
          #     eine Extra-Race, (c) macht den E2E-Image-Build von einem
          #     zusaetzlichen Workflow-Run abhaengig.
          #   * Ein im Repo hartkodierter Digest waere die Haelfte davon schlimmer:
          #     er rotiert nightly und wuerde still altern.
          # Degradation ist bewusst NICHT fatal: ohne aufloesbaren Digest laeuft
          # der Build gegen den beweglichen Tag weiter, das E2E-Image bleibt
          # funktionsfaehig, nur die Base-Provenienz faellt aus. Sichtbar
          # gemacht wird das per ::warning:: — nie still.
          ref="$BASE_TAG"
          digest="$(docker buildx imagetools inspect "$BASE_TAG" \
            --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
          case "$digest" in
            sha256:*)
              ref="${BASE_IMAGE}@${digest}"
              echo "Base-Image gepinnt: \`${ref}\`" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::warning title=Base-Image nicht auf Digest aufloesbar::Digest von ${BASE_TAG} nicht ermittelbar (Registry nicht erreichbar, Paket nicht oeffentlich, oder Buildx-Formatunsupported). Baue gegen den BEWEGLICHEN Tag ${BASE_TAG}. Das E2E-Image bleibt korrekt, verliert aber die Base-Provenienz: das Label org.opencontainers.image.base.name traegt dann den Tag statt eines Digests. Bitte 'Publish immutable reference' in base-image.yml gegenpruefen."
              echo "- ⚠️ Base-Image **nicht** auf einen Digest aufgelöst — gebaut gegen \`${BASE_TAG}\` (beweglich). Keine Base-Provenienz." >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac
          echo "base_ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Build and Push accriditation-e2e Image (amd64)
        id: build
        uses: docker/build-push-action@v7  # major tag pin — SHA-pinning is a stronger, immutable option
        with:
          context: deployment
          file: deployment/Dockerfile.e2e
          push: true
          platforms: linux/amd64
          # Digest-Pass-through (WP-9-D1), gesetzt vom Step `Resolve base image
          # reference`. Faellt die Aufloesung dort aus, steht hier der
          # bewegliche Tag — der Job bleibt gruen, nur ohne Base-Provenienz.
          # Bewusst kein Kommentar INNERHALB von `build-args`: der Block wird
          # zeilenweise als `--build-arg` geparst, ein `#`-Kommentar wird also
          # zum (wertlosen) Build-Arg.
          build-args: |
            BASE_REF=${{ steps.base.outputs.base_ref }}
            PLAYWRIGHT_VERSION=${{ steps.versions.outputs.playwright_version }}
            PNPM_VERSION=${{ steps.versions.outputs.pnpm_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Tag-Schema:
          #   :latest                      BEWEGLICH — der CI-Referenz-Tag, den
          #                                 ci.yml `e2e` konsumiert. Wird bei
          #                                 JEDEM Build neu gesetzt.
          #   :<playwright-version>        BEWEGLICH — NICHT immutable, obwohl
          #                                 der alte Kommentar hier
          #                                 "immutable ... for reproducible,
          #                                 rollback-safe runs" behauptete: der
          #                                 wöchentliche Cron baut dieselbe
          #                                 Playwright-Version erneut gegen ein
          #                                 inzwischen aktualisiertes
          #                                 accriditation-base und überschreibt
          #                                 den Tag.
          #   :<playwright-version>-<run>  immutable (Run-Nummer) — wird nie
          #                                 überschrieben.
          #   <image>@<digest>              immutable, Job-Output `image_ref`.
          #                                 Das ist die Referenz für einen
          #                                 STABILEN, auditierbaren Lauf: gleiche
          #                                 E2E-Umgebung über Runs hinweg. Es ist
          #                                 KEINE Bit-Reproduzierbarkeit —
          #                                 `composer:2` und das nodejs.org-
          #                                 `latest-v26.x`-Verzeichnis driften
          #                                 unabhängig vom Repo-Stand (siehe
          #                                 Determinismus-Absatz in Dockerfile.e2e).
          #                                 Die genaue Base steht im Image-Label
          #                                 `org.opencontainers.image.base.name`.
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/accriditation-e2e:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/accriditation-e2e:${{ steps.versions.outputs.playwright_version }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/accriditation-e2e:${{ steps.versions.outputs.playwright_version }}-${{ github.run_number }}

      - name: Publish immutable reference
        id: publish
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/accriditation-e2e
          PLAYWRIGHT_VERSION: ${{ steps.versions.outputs.playwright_version }}
          RUN_NUMBER: ${{ github.run_number }}
          DIGEST: ${{ steps.build.outputs.digest }}
          BASE_REF: ${{ steps.base.outputs.base_ref }}
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || { echo "::error::build-push-action lieferte keinen Digest"; exit 1; }
          image_ref="${IMAGE}@${DIGEST}"
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"
          {
            echo "### accriditation-e2e"
            echo
            echo "| Referenz | Art |"
            echo "| --- | --- |"
            echo "| \`${IMAGE}:${PLAYWRIGHT_VERSION}-${RUN_NUMBER}\` | immutable (Run-Nummer) |"
            echo "| \`${image_ref}\` | immutable (Digest) |"
            echo "| \`${IMAGE}:latest\`, \`${IMAGE}:${PLAYWRIGHT_VERSION}\` | **beweglich** — bei jedem Build neu gesetzt |"
            echo
            echo "Basis dieses Builds (Digest-Pass-through, WP-9-D1): \`${BASE_REF}\`"
            echo
            echo "Ebenfalls als Image-Label \`org.opencontainers.image.base.name\` hinterlegt."
            echo "Damit ist das E2E-Image **auditierbar** (welcher Base-Bitstand steckt "
            echo "drin), aber weiterhin nicht bit-reproduzierbar — \`composer:2\` und das "
            echo "nodejs.org-\`latest-v26.x\`-Verzeichnis driften unabhängig vom Repo-Stand."
          } >> "$GITHUB_STEP_SUMMARY"
