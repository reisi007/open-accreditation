services:
  db:
    image: postgres:17-alpine
    container_name: accriditation_db
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
    environment:
      POSTGRES_DB: accriditation
      POSTGRES_USER: accriditation
      # E2E/dev DB uses a plain dev password (owner decision: no secure password needed for E2E).
      POSTGRES_PASSWORD: accriditation
    ports:
      # CC-R3: bind the Postgres port to localhost only, so the DB is reachable
      # from the local machine but NOT exposed on the broader host network.
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accriditation -d accriditation"]
      interval: "10s"
      timeout: 5s
      retries: 10
    networks:
      - accriditation_internal

  mailpit:
    # CC-R4: `:latest` is a floating tag. No reproducible version is pinned in
    # this repo — pin to an immutable digest for reproducible CI/dev:
    # TODO: pin to an immutable digest (e.g. axllent/mailpit@sha256:…) for reproducible CI
    image: axllent/mailpit:latest
    container_name: accriditation_mailpit
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - accriditation_internal

  # W1: backend (PHP-FPM). Deliberately behind the `prod` profile so the
  # local/CI `docker compose up -d` keeps starting ONLY the infra services
  # (db + mailpit); use `docker compose --profile prod up -d` to start it.
  # MEDIA_ROOT is bind-mounted from the host at the exact same path the
  # external Caddy serves media from, so both containers share one media tree
  # (no Caddyfile lives in this repo — W7 owns the Caddy snippet).
  backend:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: accreditation_backend
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      MEDIA_ROOT: /srv/media/accreditation
    volumes:
      - ../backend:/var/www/html
      # Shared with Caddy: host path -> identical path in both containers.
      # Override MEDIA_ROOT_HOST when the host mount differs (default is the
      # production path documented in backend/.env.example).
      - ${MEDIA_ROOT_HOST:-/srv/media/accreditation}:/srv/media/accreditation
    depends_on:
      db:
        condition: service_healthy
    networks:
      - accriditation_internal

networks:
  accriditation_internal:

volumes:
  db_data:
