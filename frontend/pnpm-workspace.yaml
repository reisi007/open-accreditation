# pnpm >=9 settings live here (the "pnpm" field in package.json is no longer read).
# Single-package workspace: empty `packages` scope = root package only.
packages: []

# pnpm >=11 ships a built-in 24h minimumReleaseAge (supply-chain gate): a
# package version may only be resolved into the lockfile if it has been
# published for at least this many minutes. This project installs with
# `--frozen-lockfile` in CI, so the gate does not gate anything at install
# time (the lockfile is authoritative) — it gates *resolution*, i.e. it stops a
# compromised/typo-squatted release from entering the lockfile in the first
# place. Left at the pnpm default instead of disabling it.
minimumReleaseAge: 1440
